# ===============================
# 1. SERVER CONFIGURATION
# ===============================
# Ye tumhare Spring Boot app ka port hai
server.port=8080

# ===============================
# 2. MYSQL DATABASE CONFIGURATION
# ===============================
# 'hydrology_db' naam ka database MySQL mein pehle se create kar lena
spring.datasource.url=jdbc:mysql://localhost:3306/hydrology_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Yahan apna MySQL ka actual password daalna
spring.datasource.password=root_password 

# Hibernate Setup (Ye sabse important hai!)
# 'update' ka matlab hai ki Spring khud tumhari Entity class padh kar table bana dega
spring.jpa.hibernate.ddl-auto=update
# Console mein chalne wali SQL queries dekhne ke liye (debugging mein bahut kaam aata hai)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# 3. REDIS CACHE CONFIGURATION
# ===============================
# Spring ko batana ki caching ke liye Redis use karna hai
spring.cache.type=redis
# Redis by default local machine par 6379 port par chalta hai
spring.data.redis.host=localhost
spring.data.redis.port=6379
